; Painel Danni Som — limites do PHP para esta pasta.
; Logos de até 5 MB (isto é a folga do envio). Na Hostinger também dá para
; ajustar em hPanel → Avançado → Configuração do PHP → Opções do PHP.
upload_max_filesize = 8M
post_max_size = 10M
memory_limit = 256M
max_execution_time = 60
display_errors = Off
log_errors = On
