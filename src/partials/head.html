<script>
  /* As entradas animadas só valem com JavaScript e sem "reduzir movimento". Se o core.js não
     terminar a tempo (rede lenta, biblioteca fora do ar, erro), nada fica escondido. */
  (function (d) {
    var h = d.documentElement;
    h.classList.add("js");
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    h.classList.add("anim");
    setTimeout(function () { if (!h.classList.contains("anim-on")) h.classList.remove("anim"); }, 1500);
  })(document);
</script>
